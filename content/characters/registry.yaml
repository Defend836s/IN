# Персонажи роликов «Все курсы мира».
#
# main - ведущий: он есть в каждом ролике, внешность и голос не меняются.
# Остальные - гости: появляются рядом с ведущим, когда в сценарии строка
# начинается с их имени («Ника: ...»). У каждого свой голос.
#
# Внешность и голос каждого персонажа «заперты» в content/characters/locks.json.
# render_pro.py не соберёт ролик, если рисунок или голос изменились без
# подтверждения владельца. Как добавить нового персонажа - content/characters/README.md.

main: semya

characters:
  semya:
    name: Енот Сёма
    aliases: [Сёма, Сема, Енот]
    role: ведущий; находит бесплатное там, где другие платят
    module: semya            # content/tools/semya.py: pose(рот, глаза, брови)
    voice: ozornoy           # вариант из content/tools/semya_voice.py (VARIANTS)
    look: [content/tools/semya_svg.py, content/characters/semya/sprites]

  nika:
    name: Лиса Ника
    aliases: [Ника, Лиса]
    role: гость; проверяет факты - «правда или миф», где подвох
    module: guests_svg:nika  # вектор, как у Сёмы: content/tools/guests_svg.py
    voice: nika
    look: [content/tools/guests_svg.py, content/characters/nika/sprites]

  borya:
    name: Бобр Боря
    aliases: [Боря, Бобр]
    role: гость; практик - «проверено руками», пошаговые советы
    module: guests_svg:borya
    voice: borya
    look: [content/tools/guests_svg.py, content/characters/borya/sprites]
