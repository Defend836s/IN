format: carousel
character: globus
title: Как выучить навык без платного курса
caption: |-
  Курс за 60 000 ₽ не нужен, чтобы начать.
  Нужен план и 40 минут в день.

  5 шагов, по которым можно выучить почти любой навык бесплатно. Сохрани, чтобы вернуться.

  Все курсы мира - ссылка в профиле.

  #обучение #самообразование #курсы #бесплатно
slides:
  - type: cover
    title: Курс за 60 000 ₽ не нужен
    text: 5 шагов, чтобы учиться бесплатно
  - type: point
    title: Платят не за знания
    text: Платят за порядок, в котором их подают. Этот порядок можно собрать самому за вечер.
  - type: point
    title: 1. Выбери один результат
    text: Не «выучить дизайн», а «сделать лендинг для друга». Результат подскажет, что учить.
  - type: point
    title: 2. Найди программу курса
    text: Открой страницу любого платного курса. Список тем там бесплатный. Это твой план.
  - type: point
    title: 3. Закрой темы бесплатно
    text: Документация, открытые лекции университетов, YouTube. Одна тема - один вечер.
  - type: point
    title: 4. Делай, а не смотри
    text: 40 минут в день практики дают больше, чем 4 часа видео в выходные.
  - type: point
    title: 5. Покажи результат
    text: Выложи работу и попроси разбор. Обратная связь - то, за что в курсах берут больше всего.
  - type: summary
    title: Коротко
    items: [Один результат, Программа чужого курса, Бесплатные источники, 40 минут практики в день, Показать и получить разбор]
  - type: cta
    title: Сохрани, чтобы начать сегодня
    text: Все курсы мира - ссылка в профиле
