# Сайт-витрина и RSS-лента для Дзена (content/site/build.py).
# Дзен забирает материалы только с ВАШЕГО сайта: лента должна лежать на том же домене,
# что привязан к каналу в Студии Дзена (Настройки -> Свой сайт). Кириллический домен нельзя.

base_url: ""                 # например https://vsekursy.ru - без слэша в конце
title: Все курсы мира
description: Короткие разборы о том, как учиться бесплатно и не переплачивать за курсы. Новые курсы каждую неделю.
dzen_verification: ""        # значение метатега подтверждения прав из Студии Дзена (если выбрали «Метатег»)
mode: draft                  # draft - материалы приходят в черновики канала (проверяете и публикуете сами);
                             # publish - публикуются на канале сразу
first_build: 10              # первая лента - минимум 10 материалов (требование Дзена)
per_build: 2                 # дальше - сколько новых материалов добавлять за сборку
keep_days: 3                 # в ленте только материалы за последние 3 дня (требование Дзена)
