# Реестр Telegram-каналов, которые ведёт агент telegram-newsroom.
#
# Ключ бота - один на все каналы: переменная окружения TELEGRAM_BOT_TOKEN
# (бота добавляют администратором в каждый канал). chat - @имя_канала или
# числовой id (-100...): это не секрет, хранится здесь. Пока chat пустой,
# канал работает в режиме черновиков (посты сохраняются в telegram/drafts/).
#
# type: news (новости города/страны/мира) | invest (инвестиции, финансы, крипта) |
#       predictions (спортивная аналитика с честной статистикой)

feeds:   # общие ленты (RSS), из них отбираются новости по ключевым словам канала
  tass: https://tass.ru/rss/v2.xml
  ria: https://ria.ru/export/rss2/archive/index.xml
  interfax: https://www.interfax.ru/rss.asp
  rbc: https://rssexport.rbc.ru/rbcnews/news/30/full.rss

defaults:
  news:
    posts_per_run: 3          # сколько новостей за один запуск
    max_age_hours: 6          # старше - не берём
    schedule: каждые 2 часа с 7:00 до 23:00 по местному времени
  invest:
    posts_per_run: 2
    max_age_hours: 12
    schedule: 9:00 обзор рынка, 13:00 и 18:00 новости, 21:00 итоги дня
  predictions:
    schedule: за 3-6 часов до матчей, итоги - на следующий день

channels:
  # ---------------- мир и Россия
  - id: world
    type: news
    title: Новости мира
    chat: ""
    feeds: [tass, ria, interfax, rbc]
    include: []                 # пусто - все новости лент
    google_news: "мир новости"

  - id: russia
    type: news
    title: Новости России
    chat: ""
    feeds: [tass, ria, interfax, rbc]
    include: [Росси, РФ, Москв, губернатор, регион]

  # ---------------- города (добавляйте любые: id, title, include с основой названия, google_news)
  - {id: msk, type: news, title: Новости Москвы, chat: "", feeds: [tass, ria, interfax, rbc], include: [Москв, Подмосков], google_news: Москва}
  - {id: spb, type: news, title: Новости Петербурга, chat: "", feeds: [tass, ria, interfax, rbc], include: [Петербург, Ленинградск], google_news: Санкт-Петербург}
  - {id: nsk, type: news, title: Новости Новосибирска, chat: "", feeds: [tass, ria, interfax], include: [Новосибирск], google_news: Новосибирск}
  - {id: ekb, type: news, title: Новости Екатеринбурга, chat: "", feeds: [tass, ria, interfax], include: [Екатеринбург, Свердловск], google_news: Екатеринбург}
  - {id: kzn, type: news, title: Новости Казани, chat: "", feeds: [tass, ria, interfax], include: [Казан, Татарстан], google_news: Казань}
  - {id: nnov, type: news, title: Новости Нижнего Новгорода, chat: "", feeds: [tass, ria, interfax], include: ['Нижн\w* Новгород', Нижегородск], google_news: Нижний Новгород}
  - {id: chel, type: news, title: Новости Челябинска, chat: "", feeds: [tass, ria, interfax], include: [Челябинск], google_news: Челябинск}
  - {id: krsk, type: news, title: Новости Красноярска, chat: "", feeds: [tass, ria, interfax], include: [Красноярск], google_news: Красноярск}
  - {id: samara, type: news, title: Новости Самары, chat: "", feeds: [tass, ria, interfax], include: [Самар], google_news: Самара}
  - {id: ufa, type: news, title: Новости Уфы, chat: "", feeds: [tass, ria, interfax], include: ['Уф[аеы]\b', Башкир], google_news: Уфа}
  - {id: rnd, type: news, title: Новости Ростова-на-Дону, chat: "", feeds: [tass, ria, interfax], include: [Ростов, Ростовск], google_news: Ростов-на-Дону}
  - {id: krd, type: news, title: Новости Краснодара, chat: "", feeds: [tass, ria, interfax], include: [Краснодар, Кубан], google_news: Краснодар}
  - {id: omsk, type: news, title: Новости Омска, chat: "", feeds: [tass, ria, interfax], include: [Омск], google_news: Омск}
  - {id: vrn, type: news, title: Новости Воронежа, chat: "", feeds: [tass, ria, interfax], include: [Воронеж], google_news: Воронеж}
  - {id: perm, type: news, title: Новости Перми, chat: "", feeds: [tass, ria, interfax], include: [Перм], google_news: Пермь}
  - {id: vlg, type: news, title: Новости Волгограда, chat: "", feeds: [tass, ria, interfax], include: [Волгоград], google_news: Волгоград}

  # ---------------- инвестиции
  - id: invest
    type: invest
    title: Инвестиции и финансы
    chat: ""
    feeds: [rbc, interfax, tass]
    include: ['\bакци[ийяю]\w* (компани|эмитент|\w+банк|Сбер|Газпром|Яндекс)', облигаци, '\bбирж', 'курс[а-я]* (рубл|доллар|юан|евро)',
              'ключев\w+ ставк', Центробанк, 'Банк[а-я]* России', '\bЦБ\b', инфляци, 'нефт\w* (подорож|подешев|цен)', Brent,
              'цен\w* на золото', биткоин, криптовалют, Bitcoin, '\bBTC\b', '\bETF\b', дивиденд, '\bIPO\b', Мосбирж,
              'индекс\w* (Мосбирж|S&P|Nasdaq|IMOEX|РТС)', '\bВВП\b', 'ФРС', 'Минфин', 'рынок акций']
    google_news: инвестиции биржа

  # ---------------- прогнозы
  - id: predictions
    type: predictions
    title: Аналитика матчей
    chat: ""
    min_edge: 0.03            # публикуем, только если наша оценка выше вероятности по коэффициенту на 3+ п.п.
